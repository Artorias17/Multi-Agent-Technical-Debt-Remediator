version: "3.8"

services:
  python:
    image: python:3-alpine
    container_name: thesis-python
    working_dir: /workspace/thesis
    volumes:
      - ..:/workspace/thesis
      - claude_data:/root/.claude
    command: sleep infinity
    networks:
      - thesis-network

  sonarqube:
    image: sonarqube:7.5-community
    container_name: thesis-sonarqube
    ports:
      - "9000:9000"
      - "9092:9092"
    environment:
      - sonar.jdbc.url=jdbc:postgresql://sonarqube-db:5432/sonarqube
      - sonar.jdbc.username=sonar
      - sonar.jdbc.password=sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - thesis-network
    depends_on:
      - sonarqube-db

  sonarqube-db:
    image: postgres:18.3-alpine3.23
    container_name: thesis-sonarqube-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - thesis-network

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  postgres_data:
  claude_data:

networks:
  thesis-network:
    driver: bridge
